retrieval:
  hybrid: false
  candidate_k: 1000
bm25:
  backend: rank_bm25.BM25Okapi
  tokenizer: cleaned
dense:
  model: bge-small-en-v1.5
  dim: 384
  embeddings: results/week2_retrieval_cache/C2/embeddings.npy
  chunk_ids: results/week2_retrieval_cache/C2/chunk_ids.json
hybrid:
  fusion: rrf
  rrf_k: 60
  candidate_pool_k: 30
rerank:
  enabled: true
  model: Xenova/ms-marco-MiniLM-L-6-v2
  candidate_pool_k: 30
  top_k: 5
notes:
- BAAI/bge-reranker-base is the offline quality reference used for the frozen metrics
  only; at ~90.8 s/query offline it is not the runtime reranker.
- Frozen metrics are page-level (a chunk must cover the gold pdf_page) on the 37-doc
  dev slice.
- Runtime reranker choice is a config default; it is not yet benchmarked against the
  frozen metrics.
retriever: page
page:
  rerank_pool: 20
  cache: results/page_index_cache
