[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifr-qa-agent"
version = "0.1.0"
description = "Indian Financial-Report QA Agent — multi-agent RAG over financial PDFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dipak Vaidya" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]


[project.scripts]
ifr-qa = "src.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
