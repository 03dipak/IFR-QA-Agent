[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifr-qa-agent"
version = "0.1.0"
description = "Indian Financial-Report QA Agent — multi-agent RAG over financial PDFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dipak Vaidya" }]
license = { text = "MIT" }

dependencies = [
    "cachetools>=8.0.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=6.1.3",
    "openai>=3.3.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "streamlit>=1.66.1",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]


[project.scripts]
ifr-qa = "src.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "deepeval>=4.3.3",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "mypy>=2.4.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]
