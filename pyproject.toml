[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifr-qa-agent"
version = "0.1.0"
description = "Indian Financial-Report QA Agent — multi-agent RAG over financial PDFs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dipak Vaidya" }]
license = { text = "MIT" }

[project.dependencies]
fastapi = ">=0.115,<1.0"
uvicorn = ">=0.30,<1.0"
pydantic = ">=2.8,<3.0"
python-dotenv = ">=1.0,<2.0"
streamlit = ">=1.38,<2.0"
requests = ">=2.31,<3.0"
pypdf = ">=5.0,<6.0"
python-dateutil = ">=2.9,<3.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
ifr-qa = "src.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true